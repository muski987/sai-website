<!DOCTYPE html>
<html>
<head>
  <title>Secret</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container" id="login">
  <h1>Enter Password 🔐</h1>
  <p>Hint: The most attractive thing u find in me 👀</p>

  <input type="password" id="pass">
  <br><br>
  <button onclick="check()">Enter</button>

  <p id="msg"></p>
</div>

<audio id="typingSound" loop>
  <source src="typing.mp3">
</audio>

<script>
function check() {
  var password = document.getElementById("pass").value;

  if(password === "Hair") {

    document.body.innerHTML = `
      <div class="container">
        <h1>For You ❤️</h1>

        <div class="gallery">
          <img src="img1.jpg">
          <img src="img2.jpg">
          <img src="img3.jpg">
        </div>

        <p id="letter"></p><span id="cursor"></span>
      </div>
    `;

    const typingSound = document.getElementById("typingSound");
    typingSound.play();

    const text = `




[I didn’t plan you,
not like people plan love stories,
no perfect timing, no perfect version of me.

You just happened,
and suddenly everything felt a little more real.

Somewhere between random conversations
and moments I didn’t even notice then,
you became… my favourite part of everything.

It’s funny,
how you act like you don’t care sometimes,
and yet somehow,
you’re the only place I feel completely held.

I don’t say it all out loud,
not always,
but there are things I feel
every time I’m with you,
that words don’t really do justice to.

So I didn’t try to give you something perfect,
I just gave you pieces of me instead,

for the 19 years
I didn’t get to love you.

And maybe I can’t go back and be there then,
but I’m here now…

and I don’t plan on leaving anytime soon.]

`;

    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("letter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      } else {
        typingSound.pause();
      }
    }

    typeWriter();

    setInterval(() => {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 800);

  } else {
    document.getElementById("msg").innerText = "Wrong password 💔";
  }
}
</script>

</body>
</html>
